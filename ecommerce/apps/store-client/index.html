<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="NJ Store offers premium electronics shopping, quotation review, and secure order tracking across Sri Lanka."
    />
    <meta
      name="keywords"
      content="NJ Store,electronics store Sri Lanka,online electronics shopping,premium electronics,quotation checkout,secure order tracking"
    />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta property="og:title" content="NJ Store" />
    <meta
      property="og:description"
      content="Shop premium electronics, review quotations, and track orders securely with NJ Store."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NJ Store" />
    <meta property="og:image" content="/og-default.png" />
    <meta property="og:image:alt" content="NJ Store" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NJ Store" />
    <meta name="twitter:description" content="Shop premium electronics, review quotations, and track orders securely with NJ Store." />
    <meta name="twitter:image" content="/og-default.png" />
    <meta name="application-name" content="NJ Store" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NJ Store" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0A1F44" />
    <title>NJ Store</title>
    <style>
      :root {
        background: #07111f;
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #07111f;
        color: #fff;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .initial-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        background: #07111f;
      }

      .initial-logo-pulse {
        width: 80px;
        height: 80px;
        animation: logo-pulse 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        filter: drop-shadow(0 0 16px rgba(212, 175, 55, 0.3));
      }

      @keyframes logo-pulse {
        0% {
          transform: scale(0.95);
          opacity: 0.6;
        }
        50% {
          transform: scale(1.05);
          opacity: 1;
        }
        100% {
          transform: scale(0.95);
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body class="bg-dark text-white">
    <div id="root">
      <div class="initial-loader" aria-hidden="true">
        <img src="/favicon.svg" alt="Loading NJ Store..." class="initial-logo-pulse" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
